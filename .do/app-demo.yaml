# Digital Ocean App Platform spec — DEMO environment.
#
# Tracks the `community` branch of github.com/futurebuild/GableLBM and
# auto-deploys to https://demo.gablelbm.com on push. Backed by a shared
# DO Managed Postgres cluster (`gable-pg`), separate logical DB `gable_demo`.
#
# AUTH_MODE=dev is intentional: demo data is non-confidential, the seeded
# `demo@gable.com` user becomes a full admin/owner via the dev-mode
# claims-nil pass-through in pkg/middleware/auth.go.
#
# Apply with: doctl apps create --spec .do/app-demo.yaml  (first time)
#             doctl apps update <app-id> --spec .do/app-demo.yaml
name: gablelbm-demo
region: tor1
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: demo.gablelbm.com
    type: PRIMARY

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: futurebuildai/GableLBM-main
      branch: community
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /healthz/live
      initial_delay_seconds: 15
      period_seconds: 30
      failure_threshold: 3
    routes:
      - path: /api
      - path: /health
      - path: /healthz
      - path: /metrics
    envs:
      - key: PORT
        value: "8080"
      - key: AUTH_MODE
        value: dev
      - key: CORS_ORIGINS
        value: https://demo.gablelbm.com
      - key: GABLELBM_BRANCH
        value: community
      - key: DATABASE_URL
        value: ${gable-pg.DATABASE_URL}
        scope: RUN_AND_BUILD_TIME
        type: SECRET

  - name: frontend
    dockerfile_path: app/Dockerfile
    source_dir: /
    github:
      repo: futurebuildai/GableLBM-main
      branch: community
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: ""
    envs:
      - key: VITE_API_URL
        value: https://demo.gablelbm.com
        scope: BUILD_TIME
      - key: BACKEND_URL
        value: ${backend.PRIVATE_URL}
        scope: RUN_TIME
    routes:
      - path: /

jobs:
  - name: migrate-and-seed
    kind: POST_DEPLOY
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: futurebuildai/GableLBM-main
      branch: community
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: "./migrate && ./seed"
    envs:
      - key: DATABASE_URL
        value: ${gable-pg.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: GABLELBM_BRANCH
        value: community

databases:
  - name: gable-pg
    engine: PG
    version: "16"
    production: false
    cluster_name: gable-pg
    db_name: gable_demo
    db_user: gable_user
